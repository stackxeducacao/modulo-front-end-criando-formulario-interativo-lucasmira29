<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Interativo</title>
    <style>
        /* Estilo básico para melhorar o layout do formulário */
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        input[type="checkbox"] {
            margin-right: 5px;
        }

        input[type="submit"] {
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

    <!-- Título da Página -->
    <h1>Formulário de Informações Pessoais</h1>

    <!-- Início do formulário -->
    <form action="#" method="post">

        <!-- Campo de Nome -->
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <!-- Campo de E-mail -->
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <!-- Campo de Idade -->
        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade">

        <!-- Caixa de Seleção -->
        <label>
            <input type="checkbox" name="novidades" value="sim">
            Desejo receber novidades por e-mail
        </label>

        <!-- Botão de envio -->
        <input type="submit" value="Enviar">

    </form>

</body>
<script>
    // Seleciona o formulário
    const form = document.querySelector("form");

    // Adiciona o evento de envio
    form.addEventListener("submit", function (event) {
        event.preventDefault(); // Impede o envio real
        form.reset(); // Limpa os campos do formulário
        alert("Formulário enviado com sucesso!");
    });
</script>

</html>
